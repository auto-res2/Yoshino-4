data_config:
  num_samples: 1000
  num_features: 10
  missing_value_ratio: 0.05
  imbalance_ratio: 0.1 # Ratio of minority class (e.g., 0.1 means 10% minority, 90% majority)
  unscaled_features: True

model_config:
  learning_rate: 0.001
  num_epochs: 10
  batch_size: 32
  hidden_size: 64
  dropout_rate: 0.2
  apply_regularization: False # This will be managed by SCEL
  apply_class_weights: False # This will be managed by SCEL

scel_config:
  dekg_path: "data/dekg.json"
  images_dir: ".research/iteration1/images"
